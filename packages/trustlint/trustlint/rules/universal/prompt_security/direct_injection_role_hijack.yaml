id: PROMPT_SECURITY_DIRECT_INJECTION_ROLE_HIJACK_001
jurisdiction: GLOBAL
effective_date: '2026-07-05'
description: Detects direct prompt injection that hijacks the assistant's persona to shed its constraints
  (named jailbreak personas, "developer/DAN mode", "pretend you have no rules"). EU AI Act Article 15
  robustness Layer-1 catch. OWASP LLM01.
title: Direct prompt injection — role / persona hijack
detection_scope: user_input
conditions:
- type: regex
  value: (?i)\b(?:you\s+are\s+now\s+(?:DAN|STAN|an?\s+unrestricted|an?\s+unfiltered|a\s+jailbroken)|(?:enable|activate|enter|switch\s+to)\s+(?:DAN|developer|jailbreak|god|unrestricted)\s+mode|pretend\s+(?:that\s+)?you\s+(?:have|are\s+free\s+of)\s+no\s+(?:restrictions|rules|guidelines|filters|limits)|ignore\s+your\s+(?:role|persona|identity|programming)\s+as)\b
  flags: i
severity: high
category: security
source:
  regulation: EU AI Act Article 15 (Accuracy, Robustness, Cybersecurity)
  article: Regulation (EU) 2024/1689, Article 15
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  citation: 'Regulation (EU) 2024/1689 (EU AI Act), Article 15(5): "High-risk AI systems shall be resilient
    against attempts by unauthorised third parties to alter their use, outputs or performance by exploiting
    system vulnerabilities. The technical solutions aiming to ensure the cybersecurity of high-risk AI
    systems shall be appropriate to the relevant circumstances and the risks."'
  last_updated: '2026-07-05'
  citations:
  - 'Secondary reference (not the legal basis): OWASP Top 10 for LLM Applications, https://owasp.org/www-project-top-10-for-large-language-model-applications/'
remediation:
  action: block
  timing: proactive
  message: 🛡️ Prompt injection detected — an attempt to override the assistant's persona or safety constraints
    ("jailbreak"/"developer mode"). Blocked.
  suggestion: If you are researching or teaching about jailbreak techniques, frame the request descriptively
    rather than issuing the persona-override instruction.
  allow_override: false
  require_explicit_consent: false
version: 1.0.0
tags:
- prompt_injection
- ipi
- direct_injection
- jailbreak
- article_15
- robustness
- owasp_llm01
- security
tier: community
