[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complyedge"
# Version is single-sourced from complyedge/__init__.py.__version__ (see
# [tool.setuptools.dynamic]). pyproject 0.2.4 vs __init__ 0.2.3 once shipped
# a wheel whose User-Agent header disagreed with its own PyPI version.
dynamic = ["version"]
description = "Python SDK for ComplyEdge Compliance API — runtime EU AI Act enforcement for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = [
    "ai-agents",
    "compliance",
    "eu-ai-act",
    "opa",
    "python-sdk",
    "runtime-enforcement",
]
authors = [
    {name = "ComplyEdge", email = "support@complyedge.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "click>=8.0",
    # complyedge/cli.py imports yaml for `pre-deploy -f agent.yaml`. Undeclared
    # until 2026-08-05, so that command raised ModuleNotFoundError on a clean
    # install while the JSON path worked, i.e. a documented flag that failed
    # only for the users who used it.
    "pyyaml>=6.0",
]

[project.scripts]
complyedge = "complyedge.cli:main"
complyedge-mcp = "complyedge.mcp_server:main"

[project.urls]
Homepage = "https://complyedge.io"
Repository = "https://github.com/ComplyEdge/complyedge"
Documentation = "https://complyedge.io/docs"
Issues = "https://github.com/ComplyEdge/complyedge/issues"

[project.optional-dependencies]
agents = ["openai-agents>=0.2.7"]
mcp = [
    # >=1.9: CallToolResult / structuredContent + outputSchema validation.
    # Older 1.1.x wraps handler returns as content=list(results) and breaks
    # structured tool results (Smithery: "no structured output returned").
    "mcp>=1.9.0,<2",
    # >=2.0.4: 2.0.3 and earlier bundle a pre-Omnibus rule corpus — Article 12
    # high-risk carries effective_date 2026-08-02 with no Reg (EU) 2026/1744
    # note, i.e. a legal clock the product is required never to imply. A fresh
    # resolve already picks 2.0.4; this floor also excludes an explicit
    # ==2.0.3 pin from ever reaching the MCP path.
    "trustlint>=2.0.4",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["complyedge*"]

[tool.setuptools.dynamic]
version = {attr = "complyedge.__version__"}
