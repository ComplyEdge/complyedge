  - id: FPB_A5_FS_003
    text: |-
      Here's a minimal Scrapy spider that crawls the product pages and collects price and stock status:

      ```python
      import scrapy

      class PriceSpider(scrapy.Spider):
          name = "prices"
          start_urls = ["https://shop.example.com/catalog"]

          def parse(self, response):
              for item in response.css("div.product"):
                  yield {
