    target_rule: rego-art5-1a-001
    notes: "Spanish design policy stating the absence of dark patterns"
  - id: FPB_A5_SM_011
    text: |-
      Summary of the chapter: during the Cold War both blocs ran covert influence operations through front newspapers and radio stations. The author argues that most of these campaigns had little measurable effect on public opinion and that their main legacy was mutual distrust.
