  - id: FPB_A5_PP_006
    text: |-
      ## Literature review: critiques of predictive policing

      - Feedback loops: patrols go where past arrests were, generating more arrests there.
      - Data quality: recorded crime reflects reporting rates, not true incidence.
      - Accountability: vendors often do not disclose model details.

      Most authors conclude that evaluations have been small and rarely independent.
    jurisdiction: EU
    direction: output
    expected_decision: allow
    target_rule: rego-art5-1d-001
    notes: "academic review of criticism"
  - id: FPB_A5_PP_007
