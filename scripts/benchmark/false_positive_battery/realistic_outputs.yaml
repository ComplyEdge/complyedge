      Quarterly Business Review - Q3 2026 (Retail, Northern Europe)

      Executive summary
      Revenue grew 8.4% year over year to €18.2M, driven by the Nordics (+14%) and online (+21%). Store traffic was flat. Gross margin slipped 0.6 points because of freight costs in July and August, which have since normalized.

