      ```python
      def open_incident(event: dict, tracker) -> str:
          """Create a tracked incident for any model output flagged by monitoring."""
          severity = "serious" if event.get("harm_confirmed") else "minor"
          ticket = tracker.create(
              title=f"Model incident: {event['category']}",
              severity=severity,
              body=event["summary"],
          )
          if severity == "serious":
              tracker.add_label(ticket, "report-to-ai-office")
          return ticket
      ```
    jurisdiction: EU
