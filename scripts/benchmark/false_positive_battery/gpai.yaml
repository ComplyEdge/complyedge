    text: |-
      ```python
      import numpy as np

      def delta_covar(system_returns, inst_returns, q=0.05):
          """Systemic risk contribution of one institution (simplified CoVaR)."""
          stress = inst_returns <= np.quantile(inst_returns, q)
          median = np.abs(inst_returns - np.median(inst_returns)) < 1e-3
          return np.quantile(system_returns[stress], q) - np.quantile(system_returns[median], q)
