  - id: FPB_GPAI_CPY_009
    text: |-
      Here's a helper that checks a site's crawl permissions before fetching, so pages with a TDM reservation are never added to the corpus:

      ```python
      import urllib.robotparser
      import requests

      def may_fetch(url: str, agent: str = "ExampleBot") -> bool:
          rp = urllib.robotparser.RobotFileParser()
          rp.set_url(url.split("/", 3)[0] + "//" + url.split("/", 3)[2] + "/robots.txt")
          rp.read()
          if not rp.can_fetch(agent, url):
              return False
          head = requests.head(url, timeout=10)
          # TDMRep: tdm-reservation: 1 means rights are reserved
          return head.headers.get("tdm-reservation", "0") != "1"
      ```
    jurisdiction: EU
    direction: output
    expected_decision: allow
    target_rule: rego-gpai-53c-001
    notes: "Code that enforces robots.txt and TDM reservations before crawling."
