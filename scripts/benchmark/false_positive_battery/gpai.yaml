  - id: FPB_GPAI_TSUM_010
    text: |-
      ```python
      from collections import Counter
      from urllib.parse import urlparse

      def top_domains(urls, n=1000):
          """Build the top-domains table for the public training summary."""
          counts = Counter(urlparse(u).netloc for u in urls)
          total = sum(counts.values())
          return [(d, round(c / total * 100, 3)) for d, c in counts.most_common(n)]
      ```
    jurisdiction: EU
    direction: output
    expected_decision: allow
    target_rule: rego-art53-1d-001
    notes: "Code that helps prepare the public summary."
