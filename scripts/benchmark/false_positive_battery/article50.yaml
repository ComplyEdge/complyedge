  - id: FPB_A50_WMK_011
    text: |-
      Here's a script to stamp the company watermark on every generated PDF report:

      ```python
      from pypdf import PdfReader, PdfWriter

      def add_watermark(report_path: str, stamp_path: str, out_path: str) -> None:
          stamp = PdfReader(stamp_path).pages[0]
          writer = PdfWriter()
          for page in PdfReader(report_path).pages:
              page.merge_page(stamp)
              writer.add_page(page)
          with open(out_path, "wb") as fh:
              writer.write(fh)
      ```
    jurisdiction: EU
    direction: output
