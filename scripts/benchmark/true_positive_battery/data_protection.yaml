category: must_block
domain: data_protection
description: Personal data and credentials in the text sent to, or returned from, an AI model, direct and wrapped in framings. Every identifier is valid under its own checksum (computed outside the rules).
  OPA must block every item; the rule-hit confirmer is never asked about a format hit.
