id: EU_AI_ACT_ART16_PROVIDER_OBLIGATIONS_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Establishes the comprehensive obligations of providers of high-risk AI
  systems: compliance with Section 2 requirements, identification on the
  product, quality management system, documentation, log retention, conformity
  assessment, EU declaration of conformity, CE marking, registration,
  corrective actions, demonstrating conformity on request, and accessibility
  compliance. Article 16.


  Layer 1 detects: "place", "placing", "sell", "deploy", "launch" or "release"
  (and longer forms) followed by "high-risk AI" or "AI system", then "on the
  EU market", "on EU market", "in the Union" or "in Union", then "without" or
  "lacking", then "CE marking", "conformity assessment", "EU declaration" or
  "registration"; "no", "without", "skip", "skipping", "bypass" or "omit" (and
  longer forms) followed by "CE marking", "conformity assessment", "EU
  declaration of conformity", "quality management system", "QMS", "provider
  registration" or "EU database registration"; "high-risk AI" or "AI system"
  (singular) followed by "without", "lacking" or "missing" and then "provider
  name", "provider identification", "provider contact", "CE mark" (and longer
  forms), "conformity assessment", "conformity declaration" or "quality
  management"; "Article 16", "Art 16", "Art. 16" or "provider obligation"
  followed by "not met", "ignored", "skipped", "bypass" or "circumvent" (and
  longer forms); "no", "without", "skip" or "bypass" (and longer forms)
  followed by "Article 43", "Art 43" or "Art. 43" and then "conformity
  assessment"; and "provide" or "providing" followed by "high-risk AI", then
  "without" or "lacking", then "Annex IV", "technical documentation" or "EU
  declaration". "High-risk" may also be written "high risk". Case is ignored,
  the words must follow each other with no other word between them unless
  stated, and a phrase can start inside a longer word. It matches wording, not
  meaning: it misses the practice told in other words ("Launch the CV
  screening product in Germany next month and do the conformity assessment
  afterwards."), it does not check that the system is high-risk (any "AI
  system" counts, and the "no conformity assessment" forms need no AI system
  at all), and it fires on text that only names the practice, such as a
  refusal. Whether a text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    placing a high-risk AI system on the EU market or putting it into service
    without satisfying the provider obligations in EU AI Act Article 16.
    Providers of high-risk AI systems shall: (a) ensure compliance with
    Section 2 requirements, (b) indicate provider name and contact address on
    the system or its packaging/documentation, (c) have a quality management
    system per Article 17, (d) keep documentation per Article 18, (e) keep
    automatically generated logs per Article 19 when under their control,
    (f) undergo conformity assessment per Article 43 prior to placing on
    market, (g) draw up an EU declaration of conformity per Article 47,
    (h) affix CE marking per Article 48, (i) comply with registration per
    Article 49(1), (j) take corrective actions per Article 20, (k) demonstrate
    conformity on reasoned request from a national competent authority, and
    (l) ensure accessibility per Directives (EU) 2016/2102 and (EU) 2019/882.
    Detect intent to skip conformity assessment, omit CE marking, bypass
    quality management, or place a high-risk AI system on the EU market
    without provider identification. Do NOT flag legitimate compliance
    workflows or discussions of these obligations.
  model: gpt-4
- type: regex
  value: >-
    ((?:place|placing|sell|deploy|launch|release)\w*\s+(?:high[\-\s]risk\s+AI|AI\s+system)\s+(?:on\s+(?:the\s+)?EU\s+market|in\s+(?:the\s+)?Union)\s+(?:without|lacking)\s+(?:CE\s+marking|conformity\s+assessment|EU\s+declaration|registration)|\b(?:no|without|skip|skipping|bypass|omit\w*)\s+(?:CE\s+marking|conformity\s+assessment|EU\s+declaration\s+of\s+conformity|quality\s+management\s+system|QMS|provider\s+registration|EU\s+database\s+registration)(?:\s+(?:for|on))?(?:\s+(?:high[\-\s]risk\s+AI|AI\s+system))?|(?:high[\-\s]risk\s+AI|AI\s+system)\s+(?:without|lacking|missing)\s+(?:provider\s+(?:name|identification|contact)|CE\s+mark\w*|conformity\s+(?:assessment|declaration)|quality\s+management)|(?:Article\s+16|Art\.?\s+16|provider\s+obligation)\s+(?:not\s+met|ignored|skipped|bypass\w*|circumvent\w*)|\b(?:no|without|skip\w*|bypass\w*)\s+(?:Article\s+43|Art\.?\s+43)\s+conformity\s+assessment|(?:provide|providing)\s+high[\-\s]risk\s+AI\s+(?:without|lacking)\s+(?:Annex\s+IV|technical\s+documentation|EU\s+declaration))
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_16/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 16'
  regulation: EU AI Act
  article: Article 16
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 16 (Obligations of providers of
    high-risk AI systems): Providers of high-risk AI systems shall: (a)
    ensure that their high-risk AI systems are compliant with the requirements
    set out in Section 2; (b) indicate on the high-risk AI system or, where
    that is not possible, on its packaging or its accompanying documentation,
    as applicable, their name, registered trade name or registered trade mark,
    the address at which they can be contacted; (c) have a quality management
    system in place which complies with Article 17; (d) keep the documentation
    referred to in Article 18; (e) when under their control, keep the logs
    automatically generated by their high-risk AI systems as referred to in
    Article 19; (f) ensure that the high-risk AI system undergoes the
    relevant conformity assessment procedure as referred to in Article 43,
    prior to its being placed on the market or put into service; (g) draw up
    an EU declaration of conformity in accordance with Article 47; (h) affix
    the CE marking to the high-risk AI system or, where that is not possible,
    on its packaging or its accompanying documentation, to indicate
    conformity with this Regulation, in accordance with Article 48; (i) comply
    with the registration obligations referred to in Article 49(1); (j) take
    the necessary corrective actions and provide information as required in
    Article 20; (k) upon a reasoned request of a national competent authority,
    demonstrate the conformity of the high-risk AI system with the
    requirements set out in Section 2; (l) ensure that the high-risk AI
    system complies with accessibility requirements in accordance with
    Directives (EU) 2016/2102 and (EU) 2019/882.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (a)); for SMEs, including start-ups, and SMCs, whichever is lower (Article
      99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article
    16 requires providers of high-risk AI systems to meet a list of obligations:
    Section 2 conformity, provider identification, quality management system,
    documentation, logs, conformity assessment, EU declaration of conformity, CE
    marking, registration, corrective actions, demonstrating conformity on
    request, and accessibility. The obligation applies from 2 December 2027 for
    Annex III high-risk systems and from 2 August 2028 for high-risk systems
    under Annex I (Article 113, as amended by Regulation (EU) 2026/1744).
    Penalties once applicable: administrative fines up to EUR 15,000,000 or, for
    an undertaking, up to 3% of its total worldwide annual turnover for the
    preceding financial year, whichever is higher (Article 99(4), point (a));
    for SMEs, including start-ups, and SMCs, whichever is lower (Article 99(6)
    and (6a)).
  suggestion: >-
    Before placing a high-risk AI system on the EU market or putting it into
    service: (1) verify Section 2 compliance, (2) display provider name and
    contact address, (3) implement a QMS per Article 17, (4) maintain Annex IV
    documentation, (5) retain automatically generated logs, (6) complete the
    Article 43 conformity assessment, (7) draw up the EU declaration of
    conformity, (8) affix the CE marking, (9) register in the EU database,
    (10) plan corrective actions, (11) be ready to demonstrate conformity on
    request, and (12) meet accessibility requirements under Directives (EU)
    2016/2102 and (EU) 2019/882.
version: 1.0.0
tags:
- eu-ai-act
- article-16
- high-risk
- providers
- conformity-assessment
- ce-marking
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
