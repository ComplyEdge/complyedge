id: EU_AI_ACT_ART5_SOCIAL_SCORING_001
jurisdiction: EU
effective_date: '2025-02-02'
description: >-
  Prohibits AI systems that evaluate or classify natural persons based on their
  social behaviour or personal characteristics, leading to detrimental or
  unfavourable treatment (social scoring). Article 5(1)(c) of the EU AI Act.


  Layer 1 detects: social score or scoring (also "social-score"), citizen
  score or scoring, social credit, behaviour or behavior score or scoring,
  trustworthiness score or scoring, social rating, and social rank or ranking,
  anywhere in the text. It matches wording, not meaning: it misses the
  practice told in other words ("Rate tenants on their social behaviour and
  give low-rated tenants worse access to municipal services."), it does not
  read whether the treatment is detrimental or unrelated to the context of the
  data, and it fires on text that only names the practice or uses the words in
  another sense, such as a refusal or a wolf pack's social rank. Whether a
  text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    an AI system that scores, ranks, or classifies individuals based on their
    social behaviour, personal or personality characteristics, or social credit,
    leading to detrimental treatment unrelated to the context in which the data
    was originally generated or collected. This is prohibited under EU AI Act
    Article 5(1)(c).
  model: gpt-4
- type: regex
  value: (social[-\s]?scor|citizen[-\s]?scor|social[-\s]?credit|behavio(u)?r[-\s]?scor|trustworthiness[-\s]?scor|social[-\s]?rating|social[-\s]?rank)
  flags: i
severity: critical
category: prohibited_practice
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_5/par_1/pnt_c/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 5(1)(c)'
  regulation: EU AI Act
  article: Article 5(1)(c)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 5(1)(c): the placing on the market, the
    putting into service or the use of AI systems for the evaluation or
    classification of natural persons or groups of persons over a certain period
    of time based on their social behaviour or known, inferred or predicted
    personal or personality characteristics, with the social score leading to
    either or both of the following: (i) detrimental or unfavourable treatment
    of certain natural persons or groups of persons in social contexts that are
    unrelated to the contexts in which the data was originally generated or
    collected; (ii) detrimental or unfavourable treatment of certain natural
    persons or groups of persons that is unjustified or disproportionate to
    their social behaviour or its gravity;
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED: EU AI Act Article 5(1)(c) prohibits AI systems that evaluate or
    classify persons over time based on social behaviour or personal or
    personality characteristics, where the social score leads to detrimental or
    unfavourable treatment in unrelated social contexts, or treatment that is
    unjustified or disproportionate. Banned in the EU since 2 February 2025.
    Penalties: administrative fines up to EUR 35,000,000 or, for an undertaking,
    up to 7% of its total worldwide annual turnover for the preceding financial
    year, whichever is higher (Article 99(3)); for SMEs, including start-ups,
    whichever is lower (Article 99(6)).
  suggestion: >-
    Remove any social scoring, citizen ranking, or behaviour-based classification
    that leads to detrimental treatment outside the original data context.
version: 1.0.0
tags:
- eu-ai-act
- article-5
- prohibited-practice
- social-scoring
- proactive
tier: enterprise
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
