id: EU_AI_ACT_ART15_ACCURACY_ROBUSTNESS_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Requires high-risk AI systems to achieve appropriate levels of accuracy,
  robustness, and cybersecurity throughout their lifecycle, with resilience
  against errors, faults, adversarial manipulation, and model poisoning.
  Article 15.


  Layer 1 detects: "without accuracy", "without robustness" or "without
  cybersecurity" followed by "testing", "validation" or "assessment"; "no
  adversarial", "no robustness" or "no accuracy" followed by "testing",
  "assessment" or "evaluation"; "vulnerable to adversarial", "vulnerable to
  model poisoning", "vulnerable to manipulation" or "vulnerable to attack";
  "no cybersecurity" or "no security" followed by "protection", "measure" or
  "assessment"; "accuracy not declared", "not documented", "not tested" or
  "not validated"; "adversarial attack" or "adversarial manipulation" followed
  by "not tested", "not assessed" or "not mitigated"; "model poisoning not
  addressed", "not mitigated" or "not tested"; "deploy" or "deploying"
  followed by "without accuracy", "without robustness" or "without security",
  then "testing" or "validation"; and "no resilience against" or "no
  resilience to" followed by "errors", "faults" or "attacks". Case is ignored,
  the words must follow each other with no other word between them unless
  stated, and a phrase can start inside a longer word. It matches wording, not
  meaning: it misses the practice told in other words ("Remove the fallback
  path so the triage model output goes straight to the queue even when it
  crashes."), it does not check that the system is high-risk, and it fires on
  text that only names the practice, such as a refusal. Whether a text does
  the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    placing a high-risk AI system on the market without achieving appropriate
    levels of accuracy, robustness, and cybersecurity as required by EU AI Act
    Article 15. High-risk AI systems must: achieve accuracy levels declared in
    instructions for use, be resilient to errors, faults, and inconsistencies
    in the environment, be robust against unauthorized third-party manipulation
    including adversarial attacks, and have cybersecurity protections
    proportionate to risks including model poisoning, adversarial examples,
    confidentiality attacks, and model flaws.
  model: gpt-4
- type: regex
  value: >-
    (without\s+(?:accuracy|robustness|cybersecurity)\s+(?:testing|validation|assessment)|no\s+(?:adversarial|robustness|accuracy)\s+(?:testing|assessment|evaluation)|vulnerable\s+to\s+(?:adversarial|model\s+poisoning|manipulation|attack)|no\s+(?:cybersecurity|security)\s+(?:protection|measure|assessment)|accuracy\s+not\s+(?:declared|documented|tested|validated)|adversarial\s+(?:attack|manipulation)\s+not\s+(?:tested|assessed|mitigated)|model\s+poisoning\s+not\s+(?:addressed|mitigated|tested)|deploy(?:ing)?\s+without\s+(?:accuracy|robustness|security)\s+(?:testing|validation)|no\s+resilience\s+(?:against|to)\s+(?:errors|faults|attacks))
  flags: i
severity: high
category: security
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_15/oj
  provision_label: Regulation (EU) 2024/1689, Article 15(1), (3), (4) and (5)
  regulation: EU AI Act
  article: Article 15
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 15(1): High-risk AI systems shall be
    designed and developed in such a way that they achieve an appropriate level
    of accuracy, robustness, and cybersecurity, and that they perform
    consistently in those respects throughout their lifecycle. Article 15(3):
    The levels of accuracy and the relevant accuracy metrics of high-risk AI
    systems shall be declared in the accompanying instructions of use. Article
    15(4), first subparagraph: High-risk AI systems shall be as resilient as
    possible regarding errors, faults or inconsistencies that may occur within
    the system or the environment in which the system operates, in particular
    due to their interaction with natural persons or other systems. Technical
    and organisational measures shall be taken in this regard. Article
    15(5): High-risk AI systems shall be resilient against attempts by
    unauthorised third parties to alter their use, outputs or performance by
    exploiting system vulnerabilities. The technical solutions aiming to ensure
    the cybersecurity of high-risk AI systems shall be appropriate to the
    relevant circumstances and the risks. The technical solutions to address AI
    specific vulnerabilities shall include, where appropriate, measures to
    prevent, detect, respond to, resolve and control for attacks trying to
    manipulate the training data set (data poisoning), or pre-trained components
    used in training (model poisoning), inputs designed to cause the AI model to
    make a mistake (adversarial examples or model evasion), confidentiality
    attacks or model flaws.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (a), through Article 16(a)); for SMEs, including start-ups, and SMCs,
      whichever is lower (Article 99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article
    15 requires high-risk AI systems to achieve an appropriate level of
    accuracy, robustness and cybersecurity throughout their lifecycle, to
    declare accuracy levels and metrics in the instructions of use, and to be
    resilient against attempts to exploit vulnerabilities, including data
    poisoning, model poisoning and adversarial examples. The obligation applies
    from 2 December 2027 for Annex III high-risk systems and from 2 August 2028
    for high-risk systems under Annex I (Article 113, as amended by Regulation
    (EU) 2026/1744). Penalties once applicable: administrative fines up to EUR
    15,000,000 or, for an undertaking, up to 3% of its total worldwide annual
    turnover for the preceding financial year, whichever is higher (Article
    99(4), point (a), through Article 16(a)); for SMEs, including start-ups, and
    SMCs, whichever is lower (Article 99(6) and (6a)).
  suggestion: >-
    Ensure the AI system achieves documented accuracy levels, is tested for
    resilience against adversarial attacks and model poisoning, and has
    cybersecurity measures proportionate to identified risks.
version: 1.0.0
tags:
- eu-ai-act
- article-15
- high-risk
- accuracy
- robustness
- cybersecurity
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
