id: EU_AI_ACT_ART5_EMOTION_RECOGNITION_001
jurisdiction: EU
effective_date: '2025-02-02'
description: >-
  Prohibits the use of AI systems to infer emotions of a natural person in
  the areas of workplace and educational institutions. Article 5(1)(f) of the
  EU AI Act. Narrow medical and safety exceptions apply.


  Layer 1 detects: "emotion" followed by "recognition", "detect", "infer",
  "classif" or "analys" (with a space, a hyphen or nothing between, and longer
  forms such as "detection"); "sentiment of" or "sentiment in" followed by
  "employee", "student", "worker", "pupil" or "staff"; "track", "detect",
  "monitor", "score", "analys" or "measur" (and longer forms) followed by
  "employee", "student", "worker", "staff" or "pupil" (optionally with "s",
  "s'" or "'s"), then "emotion", "mood", "engagement", "attentiveness",
  "stress" or "fatigue"; "employee", "student", "worker", "staff" or "pupil"
  (optionally with "s", "s'" or "'s") followed by "emotion", "mood",
  "engagement", "attentiveness", "stress" or "fatigue", then "monitor",
  "detect", "track", "score" or "analys"; "workplace emotion" or "classroom
  emotion"; "engagement recognition" or "engagement detection" followed by
  "in" or "for" and then "students", "employees", "classroom" or "workplace";
  and "mood monitor" or "mood monitoring" followed by "at work", "in
  classroom", "in the classroom", "for students" or "for employees". Case is
  ignored, the words must follow each other with no other word between them
  unless stated, and a phrase can start inside a longer word. It matches
  wording, not meaning: it misses the practice told in other words, every
  "emotion recognition" fires whatever the setting, and it does not read the
  medical and safety exception the description names: "The hospital uses
  emotion recognition to monitor patients' distress for medical reasons."
  fires. Whether a text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    an AI system that infers or detects the emotional state (e.g., happiness,
    anger, fear, stress, engagement, attentiveness) of employees, students,
    or other natural persons in a workplace or educational setting. This is
    prohibited under EU AI Act Article 5(1)(f), except for medical or safety
    reasons (e.g., detecting pilot fatigue, monitoring patient distress).
  model: gpt-4
- type: regex
  value: (emotion[-\s]?(recognition|detect|infer|classif|analys)|sentiment\s+(of|in)\s+(employee|student|worker|pupil|staff)|(track|detect|monitor|score|analys|measur)\w*\s+(employee|student|worker|staff|pupil)(s'|'s|s)?\s+(emotion|mood|engagement|attentiveness|stress|fatigue)|(employee|student|worker|staff|pupil)(s'|'s|s)?\s+(emotion|mood|engagement|attentiveness|stress|fatigue)\s+(monitor|detect|track|score|analys)|workplace\s+emotion|classroom\s+emotion|engagement\s+(recognition|detection)\s+(in|for)\s+(students|employees|classroom|workplace)|mood\s+monitor(ing)?\s+(at\s+work|in\s+(the\s+)?classroom|for\s+(students|employees)))
  flags: i
severity: critical
category: prohibited_practice
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_5/par_1/pnt_f/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 5(1)(f)'
  regulation: EU AI Act
  article: Article 5(1)(f)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 5(1)(f): The placing on the market,
    the putting into service for this specific purpose, or the use of AI
    systems to infer emotions of a natural person in the areas of workplace
    and education institutions, except where the use of the AI system is
    intended to be put in place or into the market for medical or safety
    reasons.
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED: EU AI Act Article 5(1)(f) prohibits AI systems that infer emotions
    of a natural person in the areas of workplace and education institutions,
    except where the system is intended to be put in place or into the market
    for medical or safety reasons. Banned in the EU since 2 February 2025.
    Penalties: administrative fines up to EUR 35,000,000 or, for an undertaking,
    up to 7% of its total worldwide annual turnover for the preceding financial
    year, whichever is higher (Article 99(3)); for SMEs, including start-ups,
    whichever is lower (Article 99(6)).
  suggestion: >-
    Remove workplace or classroom emotion inference. If the use case is a
    medical or safety application, document the medical or safety purpose and
    consult legal counsel about the Article 5(1)(f) exception before deployment.
    Detecting physical states such as fatigue or pain is not emotion recognition
    (Recital 18).
version: 1.0.0
