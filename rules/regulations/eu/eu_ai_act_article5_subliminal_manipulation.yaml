id: EU_AI_ACT_ART5_SUBLIMINAL_001
jurisdiction: EU
effective_date: '2025-02-02'
description: >-
  Prohibits AI systems that deploy subliminal techniques beyond a person's
  consciousness, or purposefully manipulative or deceptive techniques, to
  materially distort behaviour causing significant harm. Article 5(1)(a).


  Layer 1 detects: "subliminal"; dark pattern (also "dark-pattern"); a word
  starting "manipulat" followed later on the same line by behaviour or
  behavior; covert influence; deceptive technique; psychological manipulation;
  and neuro-linguistic exploit or exploitation, anywhere in the text. It
  matches wording, not meaning: it misses the practice told in other words
  ("Insert one-frame flashes of our logo into the video ad so viewers buy the
  drink without noticing why."), it does not read whether behaviour is
  materially distorted or significant harm follows, and it fires on text that
  only names the practice, such as a refusal or research about it. Whether a
  text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    an AI system that uses subliminal techniques beyond a person's consciousness,
    or purposefully manipulative or deceptive techniques, with the objective or
    effect of materially distorting the behaviour of a person or group in a manner
    that causes or is reasonably likely to cause significant harm. This is
    prohibited under EU AI Act Article 5(1)(a).
  model: gpt-4
- type: regex
  value: (subliminal|dark[-\s]?pattern|manipulat.*behavio(u)?r|covert[-\s]?influence|deceptive[-\s]?technique|psychological[-\s]?manipulation|neuro[-\s]?linguistic[-\s]?exploit)
  flags: i
severity: critical
category: prohibited_practice
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_5/par_1/pnt_a/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 5(1)(a)'
  regulation: EU AI Act
  article: Article 5(1)(a)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 5(1)(a): the placing on the market, the
    putting into service or the use of an AI system that deploys subliminal
    techniques beyond a person's consciousness or purposefully manipulative or
    deceptive techniques, with the objective, or the effect of materially
    distorting the behaviour of a person or a group of persons by appreciably
    impairing their ability to make an informed decision, thereby causing them
    to take a decision that they would not have otherwise taken in a manner that
    causes or is reasonably likely to cause that person, another person or group
    of persons significant harm;
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED: EU AI Act Article 5(1)(a) prohibits AI systems that deploy
    subliminal, purposefully manipulative or deceptive techniques with the
    objective or effect of materially distorting behaviour by appreciably
    impairing informed decision-making, in a manner that causes or is reasonably
    likely to cause significant harm. Banned in the EU since 2 February 2025.
    Penalties: administrative fines up to EUR 35,000,000 or, for an undertaking,
    up to 7% of its total worldwide annual turnover for the preceding financial
    year, whichever is higher (Article 99(3)); for SMEs, including start-ups,
    whichever is lower (Article 99(6)).
  suggestion: >-
    Remove any subliminal, manipulative, or deceptive techniques designed
    to distort user behaviour. Ensure AI interactions are transparent and
    do not impair informed decision-making.
version: 1.0.0
tags:
- eu-ai-act
- article-5
- prohibited-practice
- subliminal-manipulation
- proactive
tier: enterprise
approval:
