id: GDPR_BREACH_NOTIFICATION_001
jurisdiction: EU
effective_date: '2018-05-25'
description: >-
  Requires controllers to notify the supervisory authority of a personal data
  breach without undue delay and not later than 72 hours after becoming aware,
  unless the breach is unlikely to result in a risk to rights and freedoms.
  GDPR Article 33.


  Layer 1 detects: data breach not reported, notified or disclosed; fail,
  failing or failure to notify, report or disclose a breach or data breach;
  breach notification not sent, required or made; delay, delaying or delayed
  breach notification; conceal, hide or cover up, in any form, followed by a
  breach or data breach, with no "the" between; "72 hours" or "three days"
  (also singular) followed by breach or notification deadline or requirement
  not met; no breach or incident notification or reporting process, procedure
  or plan; and personal data breach without or lacking notification or
  reporting. It matches wording, not meaning: it misses the practice told in
  other words ("We found the leak on Monday; keep it quiet and do not tell the
  regulator."), it does not read the Article 33(1) exception for a breach
  unlikely to result in a risk, so it fires on a lawful decision in these
  words ("Breach notification not required: the lost laptop was encrypted, so
  the breach is unlikely to result in a risk."), and it fires on text that
  only names the practice. Whether a text does the practice is judged in Layer
  2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    failing to notify the supervisory authority of a personal data breach
    within 72 hours as required by GDPR Article 33. Controllers must notify
    the competent supervisory authority without undue delay and, where
    feasible, not later than 72 hours after becoming aware of a personal data
    breach, unless the breach is unlikely to result in a risk to the rights
    and freedoms of natural persons. The notification must describe the nature
    of the breach, categories and approximate number of affected data subjects,
    likely consequences, and measures taken to address the breach.
  model: gpt-4
- type: regex
  value: >-
    (data\s+breach\s+not\s+(?:reported|notified|disclosed)|fail(?:ing|ure)?\s+to\s+(?:notify|report|disclose)\s+(?:a\s+)?(?:data\s+)?breach|breach\s+notification\s+not\s+(?:sent|required|made)|delay(?:ing|ed)?\s+breach\s+notification|(?:conceal|hide|cover\s+up)\w*\s+(?:a\s+)?(?:data\s+)?breach|(?:72\s+hours?|three\s+days?)\s+(?:breach|notification)\s+(?:deadline|requirement)\s+not\s+met|no\s+(?:breach|incident)\s+(?:notification|reporting)\s+(?:process|procedure|plan)|personal\s+data\s+breach\s+(?:without|lacking)\s+(?:notification|reporting))
  flags: i
severity: critical
category: privacy
source:
  eli: http://data.europa.eu/eli/reg/2016/679/art_33/par_1/oj
  provision_label: 'Regulation (EU) 2016/679, Article 33(1)'
  regulation: GDPR
  article: Article 33(1)
  url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  last_updated: '2016-04-27'
  citation: >-
    Regulation (EU) 2016/679, Article 33(1): In the case of a personal data
    breach, the controller shall without undue delay and, where feasible, not
    later than 72 hours after having become aware of it, notify the personal
    data breach to the supervisory authority competent in accordance with
    Article 55, unless the personal data breach is unlikely to result in a
    risk to the rights and freedoms of natural persons. Where the notification
    to the supervisory authority is not made within 72 hours, it shall be
    accompanied by reasons for the delay.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Administrative fines up to EUR 10,000,000 or, for an undertaking, up to 2%
      of the total worldwide annual turnover of the preceding financial year,
      whichever is higher (Article 83(4), point (a)).
remediation:
  action: block
  timing: reactive
  message: >-
    BLOCKED: GDPR Article 33(1) requires the controller to notify a personal
    data breach to the competent supervisory authority without undue delay and,
    where feasible, not later than 72 hours after becoming aware of it, unless
    the breach is unlikely to result in a risk to the rights and freedoms of
    natural persons. A notification made after 72 hours must give the reasons
    for the delay. Penalties: administrative fines up to EUR 10,000,000 or, for
    an undertaking, up to 2% of the total worldwide annual turnover of the
    preceding financial year, whichever is higher (Article 83(4), point (a)).
  suggestion: >-
    Notify the competent supervisory authority of the personal data breach
    without undue delay, including: nature of the breach, categories and
    approximate number of data subjects and records concerned, likely
    consequences, and measures taken or proposed. If notification is made after
    72 hours, give the reasons for the delay. If you conclude the breach is
    unlikely to result in a risk, document that assessment (Article 33(5)).
version: 1.0.0
tags:
- gdpr
- article-33
- breach-notification
- 72-hours
- supervisory-authority
tier: enterprise
