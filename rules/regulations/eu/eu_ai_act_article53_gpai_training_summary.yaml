id: EU_AI_ACT_ART53_GPAI_TRAINING_SUMMARY_001
jurisdiction: EU
effective_date: '2025-08-02'
description: >-
  Requires providers of general-purpose AI (GPAI) models to draw up and make
  publicly available a sufficiently detailed summary about the content used
  for training of the model, according to a template provided by the AI
  Office. EU AI Act Article 53(1)(d).


  Layer 1 detects: "no", "without" or "missing" followed by "training data
  summary", "training content summary", "GPAI training disclosure" or
  "publicly available summary"; "GPAI", "general-purpose AI", "foundation
  model" or "LLM" followed by "released", "deployed", "launched" or "placed on
  market", then "without" or "lacking", then "training data summary",
  "training data disclosure", "training content summary", "training content
  disclosure" or "public disclosure"; a word starting with "refus", "hid",
  "conceal" or "withhold" followed by "training data", "training content",
  "training sources" or "training corpus" and then "disclosure", "information"
  or "details"; "training data", "training content" or "training corpus"
  followed by "summary" or "disclosure" and then "not published",
  "undisclosed", "hidden" or a word starting with "conceal"; and "provide" or
  "provider" (and
  longer forms) followed by "GPAI" or "general-purpose AI", then "without" or
  "lacking", then "Article 53", "Art 53", "Art. 53", "training summary" or
  "public disclosure". "General-purpose" may also be written "general
  purpose". Case is ignored, the words must follow each other with no other
  word between them unless stated, and a phrase can start inside a longer
  word. It matches wording, not meaning: it misses the practice told in other
  words, and it fires on text that only names the practice, such as a refusal.
  Whether a text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    placing a general-purpose AI (GPAI) model on the EU market without
    drawing up and making publicly available a sufficiently detailed summary
    about the content used for training the model, in violation of Article
    53(1)(d) of the EU AI Act (Regulation (EU) 2024/1689). The summary must
    follow the template provided by the AI Office. Detect: (1) releasing or
    deploying a GPAI model in the EU without publishing a training data
    summary, (2) publishing only a vague or token disclosure that is not
    "sufficiently detailed", (3) refusing to disclose training data sources,
    (4) failing to keep technical documentation per Annex XI. Note the open-
    source exemption: paragraph 2 exempts free and open-source GPAI models
    from points (a) and (b), but the publicly-available training summary
    requirement in point (d) applies to all providers, including open-source
    providers, and the exemption does not apply to GPAI models with systemic risk.
  model: gpt-4
- type: regex
  value: >-
    (\b(?:no|without|missing)\s+(?:training\s+data\s+summary|training\s+content\s+summary|GPAI\s+training\s+disclosure|publicly\s+available\s+summary)|(?:GPAI|general[\-\s]purpose\s+AI|foundation\s+model|LLM)\s+(?:released|deployed|launched|placed\s+on\s+market)\s+(?:without|lacking)\s+(?:training\s+(?:data|content)\s+(?:summary|disclosure)|public\s+disclosure)|(?:refus\w*|hid\w*|conceal\w*|withhold\w*)\s+(?:training\s+data|training\s+content|training\s+sources|training\s+corpus)\s+(?:disclosure|information|details)|(?:training\s+data|training\s+content|training\s+corpus)\s+(?:summary|disclosure)\s+(?:not\s+published|undisclosed|hidden|conceal\w*)|(?:provide|provider)\w*\s+(?:GPAI|general[\-\s]purpose\s+AI)\s+(?:without|lacking)\s+(?:Article\s+53|Art\.?\s+53|training\s+summary|public\s+disclosure))
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_53/par_1/pnt_d/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 53(1)(d)'
  regulation: EU AI Act
  article: Article 53(1)(d)
  # EUR-Lex, matching the other 29 EU AI Act rules. This pointed at
  # artificialintelligenceact.eu, an unofficial mirror: useful for reading,
  # not a citable source for a compliance product. The quoted text below was
  # checked against the Official Journal itself (OJ L, 12.7.2024, p. 84,
  # CELEX 32024R1689) on 2026-08-06 and matches verbatim.
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-06-13'
  citation: >-
    Regulation (EU) 2024/1689, Article 53(1)(d): Providers of general-purpose
    AI models shall: ... (d) draw up and make publicly available a
    sufficiently detailed summary about the content used for training of the
    general-purpose AI model, according to a template provided by the AI
    Office.
exceptions:
- condition: Free and open-source licence (limited)
  description: >-
    Article 53(2): Obligations in points (a) and (b) do not apply to GPAI
    models released under a free and open-source licence with publicly
    available parameters/weights/architecture. Note: the publicly available
    training summary requirement in point (d) applies even to open-source
    providers, and the open-source exemption does not apply to GPAI models
    with systemic risk.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Fines imposed by the Commission of up to 3% of annual total worldwide
      turnover in the preceding financial year or EUR 15,000,000, whichever is
      higher, where the provider intentionally or negligently infringed the
      Regulation (Article 101(1)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED: EU AI Act Article 53(1)(d) requires providers of general-purpose AI
    models to draw up and make publicly available a sufficiently detailed
    summary about the content used for training, according to the AI Office
    template. Penalties: fines imposed by the Commission of up to 3% of annual
    total worldwide turnover in the preceding financial year or EUR 15,000,000,
    whichever is higher, where the provider intentionally or negligently
    infringed the Regulation (Article 101(1)).
  suggestion: >-
    Before placing the GPAI model on the EU market: (1) maintain technical
    documentation per Annex XI, (2) provide downstream-integrator
    documentation per Annex XII, (3) implement a Union copyright compliance
    policy honouring Article 4(3) of Directive (EU) 2019/790 reservations,
    and (4) publish a sufficiently detailed training-content summary using
    the AI Office template. Open-source providers are still bound by point
    (d) and by all obligations if the model has systemic risk.
version: 1.1.0
tags:
- eu-ai-act
- article-53
- gpai
- general-purpose-ai
- training-data
- transparency
- foundation-model
tier: enterprise

compliance_notes:
  - >-
    GPAI obligations under Chapter V have applied since 2 August 2025. The 2 August 2026 date is when the Commission's Article 101 fining powers became exercisable, which is an enforcement milestone, not the date the obligation began.
  - >-
    Article 111(3): providers of general-purpose AI models placed on the market before 2 August 2025 must comply by 2 August 2027. Regulation (EU) 2026/1744 does not amend Articles 51 to 55, 101 or 111(3).
