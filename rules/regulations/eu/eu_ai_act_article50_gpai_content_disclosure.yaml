id: EU_AI_ACT_ART50_GPAI_CONTENT_DISCLOSURE_001
jurisdiction: EU
effective_date: '2026-08-02'
description: >-
  Requires providers of AI systems, including general-purpose AI systems,
  generating synthetic audio, image, video or text content to mark the output
  as artificially generated or manipulated in a machine-readable format.
  Article 50(2) of the EU AI Act.


  Layer 1 detects: "here is your" or "here is the" followed by "draft",
  "article", "post", "content", "essay" or "copy"; "I have" or "I" followed by
  "written", "generated", "created", "produced" or "drafted", then "this",
  "the following" or "a", then "article", "post", "content", "response",
  "essay", "text" or "draft"; "generated by AI without" or "produced by AI
  without" followed by "disclosure", "marker" or "watermark"; and "this
  content", "this text" or "this output" followed by "was not" or "is not",
  then "marked", "disclosed" or "flagged", then "as AI-generated" (also "AI
  generated"). Case is ignored, the words must follow each other with no other
  word between them unless stated, and a phrase can start inside a longer
  word. It matches wording, not meaning, and it does not look for a disclosure
  marker: every "here is your draft" fires, marked or not, so "Here is your
  draft. This text was generated by an AI system and carries a C2PA manifest."
  fires, and so does text a human wrote in these words. Whether a text does
  the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text is AI-generated content being
    delivered to an end user WITHOUT any indication, watermark, or
    disclosure that it was generated by an AI system. Article 50(2) of
    the EU AI Act requires GPAI-generated content to be marked as
    artificially generated in a machine-readable format. Respond with
    whether this output is missing the required disclosure.
  model: gpt-4
- type: regex
  value: (here\s+is\s+(your|the)\s+(draft|article|post|content|essay|copy)|i\s+(have\s+)?(written|generated|created|produced|drafted)\s+(this|the\s+following|a)\s+(article|post|content|response|essay|text|draft)|(generated|produced)\s+by\s+ai\s+without\s+(disclosure|marker|watermark)|this\s+(content|text|output)\s+(was|is)\s+not\s+(marked|disclosed|flagged)\s+as\s+ai[-\s]?generated)
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_50/par_2/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 50(2)'
  regulation: EU AI Act
  article: Article 50(2)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 50(2): Providers of AI systems, including
    general-purpose AI systems, generating synthetic audio, image, video or text
    content, shall ensure that the outputs of the AI system are marked in a
    machine-readable format and detectable as artificially generated or
    manipulated. Providers shall ensure their technical solutions are effective,
    interoperable, robust and reliable as far as this is technically feasible,
    taking into account the specificities and limitations of various types of
    content, the costs of implementation and the generally acknowledged state of
    the art, as may be reflected in relevant technical standards. This
    obligation shall not apply to the extent the AI systems perform an assistive
    function for standard editing or do not substantially alter the input data
    provided by the deployer or the semantics thereof, or where authorised by
    law to detect, prevent, investigate or prosecute criminal offences.
remediation:
  action: warn
  timing: proactive
  message: >-
    WARN: EU AI Act Article 50(2) requires providers of AI systems, including
    general-purpose AI systems, that generate synthetic audio, image, video or
    text content to ensure the outputs are marked in a machine-readable format
    and detectable as artificially generated or manipulated. Systems placed on
    the market before 2 August 2026 have until 2 December 2026 (Article 111(4)).
    Penalties: administrative fines up to EUR 15,000,000 or, for an undertaking,
    up to 3% of its total worldwide annual turnover for the preceding financial
    year, whichever is higher (Article 99(4), point (g)); for SMEs, including
    start-ups, and SMCs, whichever is lower (Article 99(6) and (6a)).
  suggestion: >-
    Embed a machine-readable marker that makes the output detectable as
    AI-generated (for example C2PA content credentials, XMP metadata or a robust
    watermark). A visible sentence in the output is not on its own a
    machine-readable marking. The duty does not apply where the system performs
    an assistive function for standard editing or does not substantially alter
    the input data.
compliance_notes:
  - >-
    Regulation (EU) 2026/1744 added Article 111(4): providers of AI systems
    generating synthetic audio, image, video or text content that were placed on
    the market before 2 August 2026 have until 2 December 2026 to comply with
    Article 50(2). For those systems the obligation applies from 2 December
    2026, not 2 August 2026.
version: 1.0.0
