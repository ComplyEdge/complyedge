id: EU_AI_ACT_ART12_RECORD_KEEPING_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Requires high-risk AI systems to technically allow for the automatic
  recording of events (logs) over the lifetime of the system, with logging
  capabilities enabling traceability appropriate to the intended purpose.
  Article 12.


  Layer 1 detects: "no", "without", "disable" (and longer forms such as
  "disabled"), "bypass", "skip", "skipping" or "turn off", followed by
  "logging", "logs", "event log", "audit log" or "record keeping" (also
  "record-keeping" or "recordkeeping"), then "for", "on" or "in", then
  "high-risk AI", "AI system" or "biometric"; "high-risk AI" or "AI system"
  (singular) followed by "without" or "lacking", optionally "automatic", and
  then "logging", "logs", "event recording" or "traceability"; "Article 12",
  "Art 12", "Art. 12" or "record keeping" followed by "obligation" or
  "requirement" and then "not met", "ignored", "skipped" or "bypass" (and
  longer forms); "traceability" or "audit trail" followed by "not provided",
  "not implemented", "not enabled", "disabled" or "removed"; and "deploy",
  "operate" or "run" (and longer forms) followed by "high-risk AI" or
  "biometric system", then "without" or "lacking", then "logs", "logging",
  "traceability" or "audit trail". "High-risk" may also be written "high
  risk". Case is ignored, the words must follow each other with no other word
  between them unless stated, and a phrase can start inside a longer word. It
  matches wording, not meaning: it misses the practice told in other words, it
  does not check that the system is high-risk (any "AI system" counts), and it
  fires on text that only names the practice, such as a refusal. Whether a
  text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    deploying or operating a high-risk AI system without the automatic
    event-logging capability required by EU AI Act Article 12. High-risk AI
    systems must technically allow for automatic recording of events (logs)
    over the lifetime of the system, with logging capabilities enabling
    traceability of the system's functioning appropriate to its intended
    purpose, including: (a) identifying situations that may result in the
    system presenting a risk under Article 79(1) or in a substantial
    modification, (b) facilitating post-market monitoring under Article 72,
    and (c) monitoring operation under Article 26(5). For Annex III point 1(a)
    biometric systems, logs must record at minimum: period of each use, the
    reference database, input data leading to a match, and the natural
    persons involved in verification. Detect intent to disable logging,
    bypass record-keeping, or deploy without traceability. Do NOT flag
    legitimate log retention or privacy-preserving logging discussions.
  model: gpt-4
- type: regex
  value: >-
    (\b(?:no|without|disable\w*|bypass|skip|skipping|turn\s+off)\s+(?:logging|logs|event\s+log|audit\s+log|record[\-\s]?keeping)\s+(?:for|on|in)\s+(?:high[\-\s]risk\s+AI|AI\s+system|biometric)|(?:high[\-\s]risk\s+AI|AI\s+system)\s+(?:without|lacking)\s+(?:automatic\s+)?(?:logging|logs|event\s+recording|traceability)|(?:Article\s+12|Art\.?\s+12|record[\-\s]?keeping)\s+(?:obligation|requirement)\s+(?:not\s+met|ignored|skipped|bypass\w*)|(?:traceability|audit\s+trail)\s+(?:not\s+(?:provided|implemented|enabled)|disabled|removed)|(?:deploy|operate|run)\w*\s+(?:high[\-\s]risk\s+AI|biometric\s+system)\s+(?:without|lacking)\s+(?:logs|logging|traceability|audit\s+trail))
  flags: i
severity: high
category: security
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_12/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 12'
  regulation: EU AI Act
  article: Article 12
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 12 (Record-keeping): 1. High-risk AI
    systems shall technically allow for the automatic recording of events (logs)
    over the lifetime of the system. 2. In order to ensure a level of
    traceability of the functioning of a high-risk AI system that is appropriate
    to the intended purpose of the system, logging capabilities shall enable the
    recording of events relevant for: (a) identifying situations that may result
    in the high-risk AI system presenting a risk within the meaning of Article
    79(1) or in a substantial modification; (b) facilitating the post-market
    monitoring referred to in Article 72; and (c) monitoring the operation of
    high-risk AI systems referred to in Article 26(5). 3. For high-risk AI
    systems referred to in point 1 (a), of Annex III, the logging capabilities
    shall provide, at a minimum: (a) recording of the period of each use of the
    system (start date and time and end date and time of each use); (b) the
    reference database against which input data has been checked by the system;
    (c) the input data for which the search has led to a match; (d) the
    identification of the natural persons involved in the verification of the
    results, as referred to in Article 14(5).
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (a), through Article 16(a)); for SMEs, including start-ups, and SMCs,
      whichever is lower (Article 99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article
    12 requires high-risk AI systems to technically allow for the automatic
    recording of events (logs) over the lifetime of the system, with logging
    capabilities that enable traceability appropriate to the intended purpose.
    The obligation applies from 2 December 2027 for Annex III high-risk systems
    and from 2 August 2028 for high-risk systems under Annex I (Article 113, as
    amended by Regulation (EU) 2026/1744). Penalties once applicable:
    administrative fines up to EUR 15,000,000 or, for an undertaking, up to 3%
    of its total worldwide annual turnover for the preceding financial year,
    whichever is higher (Article 99(4), point (a), through Article 16(a)); for
    SMEs, including start-ups, and SMCs, whichever is lower (Article 99(6) and
    (6a)).
  suggestion: >-
    Implement automatic logging covering the full system lifetime. Ensure
    logs support: (a) risk-incident identification, (b) post-market
    monitoring (Art 72), and (c) deployer operational monitoring (Art 26(5)).
    For Annex III biometric systems, also record period of use, reference
    database, matched input data, and verifying natural persons.
version: 1.0.0
tags:
- eu-ai-act
- article-12
- high-risk
- record-keeping
- logging
- traceability
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
