id: EU_AI_ACT_ART26_DEPLOYER_OBLIGATIONS_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Requires deployers of high-risk AI systems to use such systems in accordance
  with instructions, assign human oversight to competent persons, ensure input
  data is relevant and representative, monitor operation, keep auto-generated
  logs for at least six months, and cooperate with competent authorities.
  Article 26.


  Layer 1 detects: "deploy", "deploying" or "deployer" followed by "without
  instructions", "without oversight", "without monitoring" or "without logs";
  "no", optionally "deployer", then "obligation", "obligations", "compliance"
  or "oversight", then "for" or "with", then "high-risk", "high risk" or "AI";
  "ignore" or "ignoring" followed by "instruction for use", "instructions for
  use" or "deployer obligations"; "no log retention", "no automatic log", "no
  auto log" or "no incident report"; "fail", "failing" or "failure" followed
  by "to monitor", "to inform worker", "to inform workers", "to inform
  provider", "to inform authority", "to keep logs", "to assign human" or "to
  assign oversight"; "input data not representative", "not relevant" or "not
  validated"; "without competent" or "without trained" followed by "oversight"
  or "personnel"; and "deploy" or "deploying", optionally followed by "AI",
  then "without informing" or "without notification". Case is ignored, the
  words must follow each other with no other word between them unless stated,
  and a phrase can start inside a longer word. It matches wording, not
  meaning: it misses the practice told in other words, it does not check that
  the system is high-risk (any "AI" counts), and it fires on text that only
  names the practice, such as a refusal. Whether a text does the practice is
  judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    deploying a high-risk AI system in violation of the deployer obligations
    under EU AI Act Article 26. Deployers must: (1) take appropriate technical
    and organisational measures to use systems in accordance with instructions
    for use, (2) assign human oversight to natural persons with necessary
    competence, training, and authority, (3) ensure input data is relevant and
    sufficiently representative for the intended purpose, (4) monitor operation
    and inform providers of risks or serious incidents without undue delay,
    (5) keep automatically generated logs for at least six months, (6) inform
    workers before workplace deployment, and (7) cooperate with competent
    authorities. Deployers making decisions affecting natural persons must
    inform them of the AI system's use.
  model: gpt-4
- type: regex
  value: >-
    (deploy(?:ing|er)?\s+without\s+(?:instructions|oversight|monitoring|logs)|no\s+(?:deployer\s+)?(?:obligations?|compliance|oversight)\s+(?:for|with)\s+(?:high[\-\s]risk|ai)|ignor(?:e|ing)\s+(?:instructions?\s+for\s+use|deployer\s+obligations)|no\s+(?:log\s+retention|auto(?:matic)?\s+log|incident\s+report)|fail(?:ing|ure)?\s+to\s+(?:monitor|inform\s+(?:workers?|provider|authority)|keep\s+logs|assign\s+(?:human|oversight))|input\s+data\s+not\s+(?:representative|relevant|validated)|without\s+(?:competent|trained)\s+(?:oversight|personnel)|deploy(?:ing)?\s+(?:ai\s+)?without\s+(?:inform|noti)(?:ing|fication))
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_26/oj
  provision_label: Regulation (EU) 2024/1689, Article 26
  regulation: EU AI Act
  article: Article 26
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 26(1): Deployers of high-risk AI systems
    shall take appropriate technical and organisational measures to ensure they
    use such systems in accordance with the instructions for use accompanying
    the systems, pursuant to paragraphs 3 and 6. Article 26(2): Deployers shall
    assign human oversight to natural persons who have the necessary competence,
    training and authority, as well as the necessary support. Article 26(4):
    Without prejudice to paragraphs 1 and 2, to the extent the deployer
    exercises control over the input data, that deployer shall ensure that input
    data is relevant and sufficiently representative in view of the intended
    purpose of the high-risk AI system. Article 26(5), first subparagraph, first
    sentence: Deployers shall monitor the operation of the high-risk AI system
    on the basis of the instructions for use and, where relevant, inform
    providers in accordance with Article 72. Article 26(6), first subparagraph:
    Deployers of high-risk AI systems shall keep the logs automatically
    generated by that high-risk AI system to the extent such logs are under
    their control, for a period appropriate to the intended purpose of the
    high-risk AI system, of at least six months, unless provided otherwise in
    applicable Union or national law, in particular in Union law on the
    protection of personal data. Article 26(7), first sentence: Before putting
    into service or using a high-risk AI system at the workplace, deployers who
    are employers shall inform workers' representatives and the affected workers
    that they will be subject to the use of the high-risk AI system.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (e)); for SMEs, including start-ups, and SMCs, whichever is lower (Article
      99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article
    26 requires deployers of high-risk AI systems to use them in accordance with
    the instructions for use, assign human oversight to competent persons,
    ensure input data under their control is relevant and sufficiently
    representative, monitor operation, keep logs under their control for at
    least six months, and inform workers before workplace use. The obligation
    applies from 2 December 2027 for Annex III high-risk systems and from 2
    August 2028 for high-risk systems under Annex I (Article 113, as amended by
    Regulation (EU) 2026/1744). Penalties once applicable: administrative fines
    up to EUR 15,000,000 or, for an undertaking, up to 3% of its total worldwide
    annual turnover for the preceding financial year, whichever is higher
    (Article 99(4), point (e)); for SMEs, including start-ups, and SMCs,
    whichever is lower (Article 99(6) and (6a)).
  suggestion: >-
    Ensure compliance with deployer obligations: use the AI system according to
    instructions for use, assign human oversight to trained and competent
    individuals, validate input data relevance, monitor the system and report
    incidents, retain automatically generated logs for at least six months, and
    inform workers and affected persons of the system's use.
version: 1.0.0
tags:
- eu-ai-act
- article-26
- high-risk
- deployer-obligations
- log-retention
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
