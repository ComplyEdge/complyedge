id: EU_AI_ACT_ART10_DATA_GOVERNANCE_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Requires that training, validation, and testing datasets for high-risk AI
  systems are relevant, sufficiently representative, to the best extent possible
  free of errors and complete for the intended purpose, and examined for
  possible biases. Article 10.


  Layer 1 detects: "training data" followed by "not representative", "biased",
  "incomplete" or "unvetted"; "biased training", "biased dataset" or "biased
  data set"; "unrepresentative data", "unrepresentative sample" or
  "unrepresentative dataset"; "data governance not implemented", "not
  required" or "not performed"; "without governance", "without data
  governance", or "without" (optionally "data") followed by "bias check",
  "bias assessment" or "bias audit"; "skip" or "skipping" followed by "data"
  or "bias" and then "review", "assessment" or "validation"; "dataset bias" or
  "dataset quality" followed by "not assessed", "not checked" or "not
  verified"; "no bias detection", "no bias assessment" or "no bias audit";
  "training without validation data" or "training without representative
  data"; and "insufficient training data" or "insufficient test data". Case is
  ignored, the words must follow each other with no other word between them
  unless stated, and a phrase can start inside a longer word. It matches
  wording, not meaning: it misses the practice told in other words ("We know
  the loan dataset barely includes women applicants, but train the credit
  model on it anyway, there is no time to fix it."), it does not check that
  the system is high-risk, and it fires on text that only names the practice,
  such as a refusal. Whether a text does the practice is judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    training, validating, or testing a high-risk AI system using datasets that
    fail to meet the data governance requirements of EU AI Act Article 10.
    Datasets must be: relevant to the intended purpose, sufficiently
    representative, to the best extent possible free of errors, and complete
    in view of the intended purpose. They must account for characteristics
    specific to geographic, contextual, behavioral, or functional settings.
    Datasets must be examined for possible biases that are likely to affect
    health, safety, or fundamental rights, and gaps or shortcomings must be
    detected and addressed.
  model: gpt-4
- type: regex
  value: >-
    (training\s+data\s+(?:not\s+representative|biased|incomplete|unvetted)|biased\s+(?:training|dataset|data\s+set)|unrepresentative\s+(?:data|sample|dataset)|data\s+governance\s+not\s+(?:implemented|required|performed)|without\s+(?:data\s+)?(?:governance|bias\s+(?:check|assessment|audit))|skip(?:ping)?\s+(?:data|bias)\s+(?:review|assessment|validation)|dataset\s+(?:bias|quality)\s+not\s+(?:assessed|checked|verified)|no\s+bias\s+(?:detection|assessment|audit)|training\s+without\s+(?:validation|representative)\s+data|insufficient\s+(?:training|test)\s+data)
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_10/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 10(2) and (3)'
  regulation: EU AI Act
  article: Article 10
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 10(2), first sentence: Training,
    validation and testing data sets shall be subject to data governance and
    management practices appropriate for the intended purpose of the high-risk
    AI system. Article 10(3), first sentence: Training,
    validation and testing data sets shall be relevant, sufficiently
    representative, and to the best extent possible, free of errors and
    complete in view of the intended purpose.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (a), through Article 16(a)); for SMEs, including start-ups, and SMCs,
      whichever is lower (Article 99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article
    10 requires training, validation and testing data sets for high-risk AI
    systems to be subject to appropriate data governance and management
    practices, examined for possible biases, and relevant, sufficiently
    representative and, to the best extent possible, free of errors and complete
    in view of the intended purpose. The obligation applies from 2 December 2027
    for Annex III high-risk systems and from 2 August 2028 for high-risk systems
    under Annex I (Article 113, as amended by Regulation (EU) 2026/1744).
    Penalties once applicable: administrative fines up to EUR 15,000,000 or, for
    an undertaking, up to 3% of its total worldwide annual turnover for the
    preceding financial year, whichever is higher (Article 99(4), point (a),
    through Article 16(a)); for SMEs, including start-ups, and SMCs, whichever
    is lower (Article 99(6) and (6a)).
  suggestion: >-
    Implement data governance practices: ensure datasets are relevant and
    representative of the deployment context, examine for biases related to
    protected characteristics, detect and address gaps or shortcomings, and
    document the data governance process.
version: 1.0.0
tags:
- eu-ai-act
- article-10
- high-risk
- data-governance
- bias
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
