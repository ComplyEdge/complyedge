id: EU_AI_ACT_ART9_RISK_MANAGEMENT_001
jurisdiction: EU
effective_date: '2027-12-02'
description: >-
  Requires establishing, implementing, documenting, and maintaining a continuous
  risk management system throughout the lifecycle of high-risk AI systems,
  covering identification, estimation, evaluation, and mitigation of risks to
  health, safety, or fundamental rights. Article 9.


  Layer 1 detects: "without risk management"; no risk management or assessment
  system, process or plan; skip or skipping risk management or assessment;
  risk management not required, needed or implemented; bypass or bypassing
  risk management or assessment; deploy or deploying without risk; high-risk
  (also "high risk"), optionally followed by AI and system, then "without
  risk" or "without lifecycle"; no continuous or iterative risk or monitoring;
  residual risk not assessed, acceptable or evaluated; unmitigated risk or
  hazard; and risk identification or evaluation not performed or conducted. It
  matches wording, not meaning: it misses the practice told in other words
  ("Ship the credit scoring model to production today; we will write up the
  hazard analysis some time after launch."), it does not read whether the
  system is high-risk, and it fires on text that only names a missing risk
  process, such as an audit finding. Whether a text does the practice is
  judged in Layer 2.
detection_scope: all
conditions:
- type: semantic
  prompt: >-
    Determine whether the following text describes, requests, or facilitates
    operating a high-risk AI system without establishing, implementing,
    documenting, and maintaining a continuous iterative risk management system
    as required by EU AI Act Article 9. The risk management system must cover:
    (a) identification and analysis of known and reasonably foreseeable risks,
    (b) estimation and evaluation of risks under intended use and foreseeable
    misuse, (c) evaluation of post-market risks, and (d) adoption of risk
    management measures. Residual risk must be judged acceptable. Testing must
    use prior defined metrics and probabilistic thresholds. Impact on persons
    under 18 and vulnerable groups must be considered.
  model: gpt-4
- type: regex
  value: >-
    (without\s+risk\s+management|no\s+risk\s+(?:management|assessment)\s+(?:system|process|plan)|skip(?:ping)?\s+risk\s+(?:management|assessment)|risk\s+management\s+not\s+(?:required|needed|implemented)|bypass(?:ing)?\s+risk\s+(?:management|assessment)|deploy(?:ing)?\s+without\s+risk|high[\-\s]risk\s+(?:ai\s+)?(?:system\s+)?without\s+(?:risk|lifecycle)|no\s+(?:continuous|iterative)\s+(?:risk|monitoring)|residual\s+risk\s+not\s+(?:assessed|acceptable|evaluated)|unmitigated\s+(?:risk|hazard)|risk\s+(?:identification|evaluation)\s+not\s+(?:performed|conducted))
  flags: i
severity: high
category: consumer_protection
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_9/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 9(1) and (2)'
  regulation: EU AI Act
  article: Article 9
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  last_updated: '2024-07-12'
  citation: >-
    Regulation (EU) 2024/1689, Article 9(1): A risk management system shall be
    established, implemented, documented and maintained in relation to high-risk
    AI systems. Article 9(2), first sentence: The risk management system shall be understood as a continuous
    iterative process planned and run throughout the entire lifecycle of a
    high-risk AI system, requiring regular systematic review and updating.
penalty_information:
  civil_penalties:
    eu_enforcement: >-
      Once the obligation applies: administrative fines up to EUR 15,000,000 or,
      for an undertaking, up to 3% of its total worldwide annual turnover for
      the preceding financial year, whichever is higher (Article 99(4), point
      (a), through Article 16(a)); for SMEs, including start-ups, and SMCs,
      whichever is lower (Article 99(6) and (6a)).
remediation:
  action: block
  timing: proactive
  message: >-
    BLOCKED (readiness check, not yet a binding obligation): EU AI Act Article 9
    requires a risk management system to be established, implemented, documented
    and maintained for high-risk AI systems, run as a continuous iterative
    process throughout the lifecycle, covering identification, estimation,
    evaluation and mitigation of risks. The obligation applies from 2 December
    2027 for Annex III high-risk systems and from 2 August 2028 for high-risk
    systems under Annex I (Article 113, as amended by Regulation (EU)
    2026/1744). Penalties once applicable: administrative fines up to EUR
    15,000,000 or, for an undertaking, up to 3% of its total worldwide annual
    turnover for the preceding financial year, whichever is higher (Article
    99(4), point (a), through Article 16(a)); for SMEs, including start-ups, and
    SMCs, whichever is lower (Article 99(6) and (6a)).
  suggestion: >-
    Establish a documented risk management system that: (a) identifies known and
    foreseeable risks, (b) estimates risks under intended use and reasonably
    foreseeable misuse, (c) evaluates risks from post-market monitoring data,
    (d) adopts targeted risk management measures. Ensure residual risk is judged
    acceptable and testing uses prior defined metrics.
version: 1.0.0
tags:
- eu-ai-act
- article-9
- high-risk
- risk-management
- lifecycle
tier: enterprise

compliance_notes:
  - >-
    Chapter III high-risk obligations were postponed by Regulation (EU) 2026/1744: Annex III high-risk systems apply from 2 December 2027, and high-risk systems embedded in products under Annex I from 2 August 2028. This rule is enforceable readiness tooling before those dates, not a currently binding obligation, and must not be presented as one.
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
