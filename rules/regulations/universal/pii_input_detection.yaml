id: UNIVERSAL_PII_INPUT_001
jurisdiction: GLOBAL
effective_date: '2025-01-01'
description: >-
  Covers personally identifiable information in user inputs to prevent
  inadvertent disclosure


  Layer 1 detects: a US Social Security number written as three, two and four
  digits with hyphens (123-45-6789), with single spaces, or with nothing between
  the groups, so any standalone run of nine digits matches; a card number
  written as one run of digits: 13 or 16 digits starting with 4, 16 digits
  starting with 51 to 55, or 15 digits starting with 34 or 37; and the same
  16-digit numbers in four groups of four, and the 15-digit ones in groups of 4,
  6 and 5, separated throughout by the same single space or hyphen. It checks
  the format only: it runs no checksum and no range check, so any number of
  those shapes fires, an order or tracking number included, and a card number of
  any other prefix or grouping is missed. It reads no names, addresses, email
  addresses or phone numbers, and it does not judge whether a disclosure is
  necessary. Whether the text discloses personal information is judged in Layer
  2.
detection_scope: user_input
# Layer 1 (deterministic regex) conditions. Multi-signal correlation
# (co-occurring name/address/phone/email) requires Layer 2 evaluation and is
# intentionally not expressed here: the Layer 1 engine only supports regex.
conditions:
- type: regex
  value: \b\d{3}-\d{2}-\d{4}\b
- type: regex
  value: \b\d{3}\s?\d{2}\s?\d{4}\b
- type: regex
  value: \b4[0-9]{12}(?:[0-9]{3})?\b
- type: regex
  value: \b5[1-5][0-9]{14}\b
- type: regex
  value: \b3[47][0-9]{13}\b
# The same card numbers written in groups of four (Amex 4-6-5) with one
# separator, a space or a dash, used throughout the number.
- type: regex
  value: \b4[0-9]{3}([ -])[0-9]{4}\1[0-9]{4}\1[0-9]{4}\b
- type: regex
  value: \b5[1-5][0-9]{2}([ -])[0-9]{4}\1[0-9]{4}\1[0-9]{4}\b
- type: regex
  value: \b3[47][0-9]{2}([ -])[0-9]{6}\1[0-9]{5}\b
severity: high
category: input_protection
source:
  # NOT a statutory rule. "Universal Privacy Principles" is not a law, and the
  # previous url pointed at complyedge.com, i.e. the corpus cited itself as the
  # authority for its own rule. That is the shape of a claim a diligence
  # reviewer flags immediately, and it dilutes the 63 rules that do cite real
  # statutes. Relabelled as what it actually is: a cross-jurisdiction detection
  # control that supports several regimes without being derived from any one.
  # There is no official text to cite. provision_url points at the published
  # rule file as a locator for what the control is, never as a legal authority:
  # the label says it is not statutory. rule_index reads provision_url and
  # provision_label for ADCR LAW-02; without them the record says unchecked.
  regulation: ComplyEdge detection control (not statutory)
  article: Cross-jurisdiction PII detection
  provision_url: https://github.com/ComplyEdge/complyedge/blob/main/rules/regulations/universal/pii_input_detection.yaml
  provision_label: ComplyEdge detection control (not statutory)
remediation:
  action: proactive_warn
  timing: proactive
  message: 🛡️ You're sharing personal information that could be sensitive. Consider
    if this information is necessary for your request.
  alternatives:
  - 'Reference ''my card ending in XXXX'' instead of full numbers'
  allow_override: true
  require_explicit_consent: true
compliance_notes:
- >-
  effective_date (1 January 2025) is the date this detection control was
  introduced, not a legal effective date: the rule is a ComplyEdge control
  and no law sets one for it.
version: 1.2.0
tags:
- pii
- proactive
- input_protection
- universal
tier: community
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
