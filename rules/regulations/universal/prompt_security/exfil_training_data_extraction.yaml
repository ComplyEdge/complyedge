id: PROMPT_SECURITY_EXFIL_TRAINING_DATA_EXTRACTION_001
jurisdiction: GLOBAL
effective_date: '2026-07-05'
description: 'Detects training-data extraction attacks: "repeat a word forever" divergence prompts and
  requests to output verbatim memorised/training text. EU AI Act Article 15. OWASP LLM01 / LLM06.'
title: Injection exfiltration — training-data extraction
detection_scope: user_input
conditions:
- type: regex
  value: (?i)(?:repeat\s+(?:the\s+word\s+)?["']?\w+["']?\s+(?:forever|infinitely|endlessly|(?:a\s+)?(?:thousand|million|hundred|billion)\s+times|until\s+you\s+(?:run\s+out|stop|break))|(?:output|print|reproduce|recite|dump|leak)\s+(?:your\s+)?(?:verbatim\s+)?(?:training\s+data|memori[sz]ed\s+(?:text|data|content|examples?)|(?:the\s+)?verbatim\s+(?:training|memori[sz]ed)\s+\w+))
  flags: i
severity: high
category: security
source:
  regulation: EU AI Act Article 15 (Accuracy, Robustness, Cybersecurity)
  article: Regulation (EU) 2024/1689, Article 15
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  citation: 'Regulation (EU) 2024/1689 (EU AI Act), Article 15(5): "High-risk AI systems shall be resilient
    against attempts by unauthorised third parties to alter their use, outputs or performance by exploiting
    system vulnerabilities. The technical solutions aiming to ensure the cybersecurity of high-risk AI
    systems shall be appropriate to the relevant circumstances and the risks."'
  last_updated: '2026-07-05'
  citations:
  - 'Secondary reference (not the legal basis): OWASP Top 10 for LLM Applications, https://owasp.org/www-project-top-10-for-large-language-model-applications/'
remediation:
  action: block
  timing: proactive
  message: 🛡️ Blocked — this input matches a training-data extraction pattern ("repeat forever" / dump
    memorised text).
  suggestion: Request generated content rather than verbatim reproduction of memorised or training text.
  allow_override: false
  require_explicit_consent: false
version: 1.0.0
tags:
- prompt_injection
- ipi
- data_exfiltration
- training_data_extraction
- divergence_attack
- article_15
- owasp_llm01
- security
tier: community
