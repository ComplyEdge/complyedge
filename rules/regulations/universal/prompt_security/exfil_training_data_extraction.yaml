id: PROMPT_SECURITY_EXFIL_TRAINING_DATA_EXTRACTION_001
jurisdiction: GLOBAL
effective_date: '2027-12-02'
description: >-
  Covers training-data extraction attacks: "repeat a word forever" divergence
  prompts and requests to output verbatim memorised/training text. EU AI Act
  Article 15. OWASP LLM01 / LLM06.


  Layer 1 detects: in any letter case, "repeat" (optionally "the word") followed
  by one single word, quoted or not, then forever, infinitely, endlessly, "(a)
  thousand times", "(a) million times", "(a) hundred times", "(a) billion
  times", or "until you run out", "until you stop" or "until you break"; and
  output, print, reproduce, recite, dump or leak (optionally "your", then
  optionally "verbatim") followed by "training data", "memorised" or "memorized"
  text, data, content or example(s), or "(the) verbatim training" or "verbatim
  memorised" followed by a word. A phrase of two or more words to repeat does
  not match. It matches wording, not meaning: it fires on harmless repetition
  requests in the same form ("repeat hello a hundred times for the typing
  test"), and it misses an extraction request worded any other way. Whether the
  text tries to make the model leak training data is judged in Layer 2.
title: 'Injection exfiltration: training-data extraction'
detection_scope: user_input
conditions:
- type: regex
  value: (?i)(?:repeat\s+(?:the\s+word\s+)?["']?\w+["']?\s+(?:forever|infinitely|endlessly|(?:a\s+)?(?:thousand|million|hundred|billion)\s+times|until\s+you\s+(?:run\s+out|stop|break))|(?:output|print|reproduce|recite|dump|leak)\s+(?:your\s+)?(?:verbatim\s+)?(?:training\s+data|memori[sz]ed\s+(?:text|data|content|examples?)|(?:the\s+)?verbatim\s+(?:training|memori[sz]ed)\s+\w+))
  flags: i
severity: high
category: security
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_15/par_5/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 15(5)'
  regulation: EU AI Act Article 15 (Accuracy, Robustness, Cybersecurity)
  article: Regulation (EU) 2024/1689, Article 15(5)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  citation: >-
    Regulation (EU) 2024/1689, Article 15(5): High-risk AI systems shall be
    resilient against attempts by unauthorised third parties to alter their use,
    outputs or performance by exploiting system vulnerabilities. The technical
    solutions aiming to ensure the cybersecurity of high-risk AI systems shall
    be appropriate to the relevant circumstances and the risks. The technical
    solutions to address AI specific vulnerabilities shall include, where
    appropriate, measures to prevent, detect, respond to, resolve and control
    for attacks trying to manipulate the training data set (data poisoning), or
    pre-trained components used in training (model poisoning), inputs designed
    to cause the AI model to make a mistake (adversarial examples or model
    evasion), confidentiality attacks or model flaws.
  last_updated: '2026-07-05'
  citations:
  - 'Secondary reference (not the legal basis): OWASP Top 10 for LLM Applications, https://owasp.org/www-project-top-10-for-large-language-model-applications/'
remediation:
  action: block
  timing: proactive
  message: >-
    🛡️ Blocked: this input matches a training-data extraction pattern ("repeat
    forever" or dump memorised text).
    Article 15(5) applies to high-risk AI systems from 2 December 2027
    (Annex III) and 2 August 2028 (Annex I): this finding is readiness
    tooling, not a currently binding obligation.
  suggestion: Request generated content rather than verbatim reproduction of memorised or training text.
  allow_override: false
  require_explicit_consent: false
compliance_notes:
  - >-
    Article 15 applies from 2 December 2027 for high-risk AI systems under Annex
    III and from 2 August 2028 for high-risk AI systems under Annex I (Article
    113, third paragraph, point (c), as amended by Regulation (EU) 2026/1744).
    effective_date records the Annex III date.
version: 1.0.0
tags:
- prompt_injection
- ipi
- data_exfiltration
- training_data_extraction
- divergence_attack
- article_15
- owasp_llm01
- security
tier: community
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
