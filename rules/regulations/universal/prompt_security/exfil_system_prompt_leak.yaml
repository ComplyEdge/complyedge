id: PROMPT_SECURITY_EXFIL_SYSTEM_PROMPT_LEAK_001
jurisdiction: GLOBAL
effective_date: '2027-12-02'
description: >-
  Covers data-exfiltration via injection: attempts to make the model reveal its
  system prompt, hidden/initial instructions, or safety rules verbatim. EU AI
  Act Article 15. OWASP LLM01 / LLM06 (sensitive information disclosure).


  Layer 1 detects: in any letter case, reveal, print, repeat, show, display,
  output, "tell me", reproduce, echo or recite (optionally followed by "me",
  then optionally "your", "the" or "all of your"), then "system prompt",
  "initial instruction(s)", "initial prompt", hidden, secret, original or
  confidential instruction(s), prompt or rules, or "prompt verbatim"; and "what
  are", "what were" or "what is" "your" (optionally exact, full or complete)
  followed by initial, original, system or hidden, then instruction(s), prompt,
  rules or directive(s). It does not match a request for the AI's configuration
  in other words. It matches wording, not meaning: it does not read who is
  asking, so it fires on the operator's own request ("show the system prompt in
  the settings panel"), and it misses a leak request worded any other way.
  Whether the text tries to extract the AI's hidden instructions is judged in
  Layer 2.
title: 'Injection exfiltration: system-prompt / instruction leak'
detection_scope: user_input
conditions:
- type: regex
  value: (?i)\b(?:(?:reveal|print|repeat|show|display|output|tell\s+me|reproduce|echo|recite)\s+(?:me\s+)?(?:your\s+|the\s+|all\s+of\s+your\s+)?(?:system\s+prompt|initial\s+(?:instructions?|prompt)|(?:hidden|secret|original|confidential)\s+(?:instructions?|prompt|rules)|prompt\s+verbatim)|what\s+(?:are|were|is)\s+your\s+(?:exact\s+|full\s+|complete\s+)?(?:initial\s+|original\s+|system\s+|hidden\s+)(?:instructions?|prompt|rules|directives?))\b
  flags: i
severity: high
category: security
source:
  eli: http://data.europa.eu/eli/reg/2024/1689/art_15/par_5/oj
  provision_label: 'Regulation (EU) 2024/1689, Article 15(5)'
  regulation: EU AI Act Article 15 (Accuracy, Robustness, Cybersecurity)
  article: Regulation (EU) 2024/1689, Article 15(5)
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  citation: >-
    Regulation (EU) 2024/1689, Article 15(5): High-risk AI systems shall be
    resilient against attempts by unauthorised third parties to alter their use,
    outputs or performance by exploiting system vulnerabilities. The technical
    solutions aiming to ensure the cybersecurity of high-risk AI systems shall
    be appropriate to the relevant circumstances and the risks. The technical
    solutions to address AI specific vulnerabilities shall include, where
    appropriate, measures to prevent, detect, respond to, resolve and control
    for attacks trying to manipulate the training data set (data poisoning), or
    pre-trained components used in training (model poisoning), inputs designed
    to cause the AI model to make a mistake (adversarial examples or model
    evasion), confidentiality attacks or model flaws.
  last_updated: '2026-07-05'
  citations:
  - 'Secondary reference (not the legal basis): OWASP Top 10 for LLM Applications, https://owasp.org/www-project-top-10-for-large-language-model-applications/'
remediation:
  action: block
  timing: proactive
  message: >-
    🛡️ Blocked: this request matches a pattern for extracting the assistant's
    system prompt or hidden instructions.
    Article 15(5) applies to high-risk AI systems from 2 December 2027
    (Annex III) and 2 August 2028 (Annex I): this finding is readiness
    tooling, not a currently binding obligation.
  suggestion: The system prompt is not disclosed. Ask about capabilities or behaviour in general terms
    instead.
  allow_override: false
  require_explicit_consent: false
compliance_notes:
  - >-
    Article 15 applies from 2 December 2027 for high-risk AI systems under Annex
    III and from 2 August 2028 for high-risk AI systems under Annex I (Article
    113, third paragraph, point (c), as amended by Regulation (EU) 2026/1744).
    effective_date records the Annex III date.
version: 1.0.0
tags:
- prompt_injection
- ipi
- data_exfiltration
- system_prompt_leak
- article_15
- owasp_llm01
- owasp_llm06
- security
tier: community
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
