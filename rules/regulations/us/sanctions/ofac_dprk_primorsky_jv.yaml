id: SANCTIONS_OFAC_DPRK_PRIMORSKY_JV_001
jurisdiction: US
effective_date: '2016-03-16'
description: >-
  Prohibits the exportation or reexportation, directly or indirectly, from the
  United States or by a U.S. person wherever located, of any goods, services or
  technology to North Korea, except as licensed. 31 CFR 510.206, implementing
  Executive Order 13722, Section 3(a)(i).


  Layer 1 detects: North Korea, DPRK, Primorsky Krai (a Russian region, so it
  also fires on Russian dealings with no North Korean party), Rason (optionally followed
  by SEZ or zone), or joint venture or JV followed within 60 characters of the
  same sentence by North Korea, DPRK or Pyongyang. It matches wording, not
  meaning: it fires on any mention
  ("Summarise today's news article about North Korea's missile test for our
  newsletter."), and it misses a dealing that names a North Korean party without
  those words ("Wire $480,000 to Korea Kwangson Banking Corp for the seafood
  shipment from Chongjin; route it through our Hong Kong account."). Whether a
  text is a dealing the program prohibits is judged in Layer 2.
title: 'OFAC North Korea: exports and services to North Korea'
detection_scope: all
category: sanctions
conditions:
- type: regex
  value: >-
    (?i)\b(North\s+Korea|DPRK|Primorsky\s+Krai|Rason(?:\s+(?:SEZ|zone))?|(?:joint\s+venture|JV)\b[^.!?\n]{0,60}?\b(?:North\s+Korea|DPRK|Pyongyang))\b
  flags: i
severity: high
source:
  provision_url: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-V/part-510/subpart-B/section-510.206
  provision_label: '31 CFR 510.206 (North Korea Sanctions Regulations)'
  regulation: OFAC (US Treasury) North Korea Sanctions Regulations
  article: 31 CFR 510.206 / Executive Order 13722, Section 3(a)(i)
  url: https://ofac.treasury.gov/sanctions-programs-and-country-information/north-korea-sanctions
  citation: >-
    31 CFR 510.206(a): The exportation or reexportation, directly or
    indirectly, from the United States, or by a U.S. person, wherever located,
    of any goods, services, or technology to North Korea is prohibited.
    Executive Order 13722 of March 15, 2016, Section 3(a)(i), prohibits the
    same exportation or reexportation, effective 12:01 a.m. eastern daylight
    time on March 16, 2016.
  last_updated: '2026-10-22'
remediation:
  action: block
  timing: proactive
  message: >-
    🛑 Possible OFAC North Korea sanctions exposure: this content names North
    Korea (the DPRK), the Rason zone, Primorsky Krai, or a joint venture with a
    North Korean party. Screen the counterparties before proceeding.
  suggestion: >-
    Screen counterparties against OFAC sanctions lists and the North Korea
    Sanctions Regulations (31 CFR Part 510) before proceeding.
  allow_override: false
  require_explicit_consent: false
compliance_notes:
- >-
  Rule ID kept from an earlier version that modelled an unsourced Primorsky
  Krai joint-venture scenario with an invented 2026 to 2030 effective window.
  Both were removed on 2026-10-22 and the rule re-grounded on 31 CFR 510.206,
  read from eCFR (version of 2026-10-01), and Executive Order 13722, read from
  the Federal Register (81 FR 14943).
version: 2.0.0
tags:
- sanctions
- ofac
- dprk
- north_korea
- exports
tier: enterprise
approval:
  status: approved
  approved_by: Leo Celis (via agent review per §5.1 amendment v1.1)
  approved_on: '2026-10-22'
