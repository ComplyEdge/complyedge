  art_53_1_c_copyright_transparency:
    score: 1
    rationale: >-
      Anthropic acknowledges respecting robots.txt and operates ClaudeBot
      with opt-out via crawler identifier. No published copyright policy
      describing identification of TDM reservations or rightsholder
      compliance procedures.
