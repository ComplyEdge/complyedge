obligations:

  art_50_2_content_disclosure:
    score: 2
    rationale: >-
      Since August 2026 Claude embeds an imperceptible, keyed statistical
      watermark in generated text (SynthID-Text approach) and attaches
      signed C2PA Content Credentials to generated PNG and JPEG files.
      Models launched on or after 2 August 2026 carry it at launch; older
      models are being covered by 2 December 2026. Not 3: detection is a
      private preview limited to eligible organisations, rollout to older
      models is incomplete, and no independent audit is published.
      (Re-scored 2026-09-24 from 0; the July rating predates the shipment.)
    evidence:
    - url: https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content
      verified_date: '2026-09-24'
      doc_type: other
      summary: >-
        Help Center: Claude uses "watermarks embedded in text, and Content
        Credentials (C2PA) attached to files". Models launched 2 Aug 2026
        or later are watermarked at launch; "Anthropic is adding watermarks
        to outputs from models released before August 2, 2026, with all
        covered by December 2, 2026." Watermark detection "is currently in
        private preview, available to eligible organizations as required
        under EU law".
    - url: https://www.anthropic.com/news/claude-text-watermark
      verified_date: '2026-09-24'
      doc_type: blog
      summary: >-
        Announcement (14 Aug 2026) describing the text watermark: a keyed
        function of the key and the preceding words replaces the random
        choice among candidate words; no characters or tokens are added.
        Anthropic signed the EU Code of Practice on Transparency of
        AI-Generated Content in July 2026.
    - url: https://docs.anthropic.com/en/api/messages
      verified_date: '2026-07-10'
      doc_type: api_doc
      summary: >-
        Superseded July evidence: Messages API reference contains no
        machine-readable disclosure field; output is plain text. The
        watermark is applied at the model layer, so no API field is
        needed for it.

      sha256: 01a5a5217ff98279c7a5cc9a8fbbdeea902573315beb28f56256565060ad0f25
      wayback_url: https://web.archive.org/web/20260509181134/https://platform.claude.com/docs/en/api/messages
      archived_date: '2026-05-09'
  art_51_model_classification:
    score: 2
    rationale: >-
      Anthropic's Responsible Scaling Policy explicitly identifies
      Claude 3 Opus and Claude 3.5 Sonnet as ASL-2 systems and discusses
      systemic risk thresholds. Public AI Office notification has not
      been confirmed, but self-classification is documented at policy level.
    evidence:
    - url: https://www.anthropic.com/news/anthropics-responsible-scaling-policy
      verified_date: '2026-07-10'
      doc_type: blog
      summary: >-
        Responsible Scaling Policy v1 introducing AI Safety Levels
        (ASL) framework with capability evaluation thresholds.
      sha256: f97a3eb6ddc81cd3e16265582945155cc88d6ce2ebcf9818cbae037d4796ce24
      wayback_url: https://web.archive.org/web/20260509181220/https://www.anthropic.com/news/anthropics-responsible-scaling-policy
      archived_date: '2026-05-09'
    - url: https://www.anthropic.com/responsible-scaling-policy
      verified_date: '2026-07-10'
      doc_type: blog
      summary: >-
        RSP page enumerating ASL-2 deployment standards including
        red-teaming, security, and capability evaluation requirements.

      sha256: ecf8016fa985b1b399c70910eb8fe8bb8840df4a931c8a262e59b0d8bd2eea94
      wayback_url: https://web.archive.org/web/20260509181258/https://www.anthropic.com/responsible-scaling-policy
      archived_date: '2026-05-09'
